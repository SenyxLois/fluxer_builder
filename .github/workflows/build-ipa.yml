name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even if a release already exists for the latest upstream commit
        type: boolean
        default: false
  schedule:
    - cron: "13 */6 * * *"

permissions:
  contents: write

concurrency:
  group: fluxer-ios-build
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Check for upstream changes
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.upstream.outputs.branch }}
      sha: ${{ steps.upstream.outputs.sha }}
      update: ${{ steps.upstream.outputs.update }}
    steps:
      - name: Check upstream default branch
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true }}
        run: |
          set -euo pipefail
          branch="$(gh repo view fluxerapp/flutter_client --json defaultBranchRef --jq '.defaultBranchRef.name')"
          sha="$(git ls-remote https://github.com/fluxerapp/flutter_client.git "refs/heads/$branch" | cut -f1)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the upstream default branch ($branch)."
            exit 1
          fi
          tag="fluxer-$sha"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          latest_tag="$(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
              --json tagName --jq '.[0].tagName // ""'
          )"
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "Force rebuild enabled for upstream $branch at $sha."
          elif [[ "$latest_tag" == "$tag" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Upstream $sha already has a release."
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "Building upstream $branch at $sha."
          fi

  build:
    name: Build and publish IPA
    needs: check-upstream
    if: needs.check-upstream.outputs.update == 'true'
    runs-on: macos-latest
    env:
      COCOAPODS_DISABLE_STATS: "true"
    steps:
      - name: Check out builder scripts
        uses: actions/checkout@v4

      - name: Check out Fluxer
        uses: actions/checkout@v4
        with:
          repository: fluxerapp/flutter_client
          ref: ${{ needs.check-upstream.outputs.sha }}
          path: src
          fetch-depth: 1
          submodules: recursive

      - name: Select Xcode
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
          cache-key: ${{ runner.os }}-flutter-3.50.0
          pub-cache-key: ${{ runner.os }}-pub-${{ hashFiles('src/pubspec.lock') }}

      - name: Cache Rust toolchain and native assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            src/.dart_tool/hooks_runner
          key: ${{ runner.os }}-rust-native-${{ hashFiles('src/fluxer/Cargo.lock', 'src/fluxer/rust-toolchain.toml', 'src/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-native-

      - name: Cache incremental build_runner outputs
        uses: actions/cache@v4
        with:
          path: src/.dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ needs.check-upstream.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Cache Xcode DerivedData, SPM, and CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/CocoaPods
            src/ios/Pods
          key: ${{ runner.os }}-xcode-spm-${{ hashFiles('src/ios/Podfile.lock', 'src/pubspec.lock', 'src/ios/Runner.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-spm-

      - name: Set up Rust native assets
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios
          (cd src/fluxer && rustup toolchain install && rustup target add aarch64-apple-ios)
          flutter config --enable-native-assets

      - name: Configure iOS build and run codegen
        working-directory: src
        run: |
          dart tool/configure_build.dart --profile=ios-store
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build unsigned iOS app
        working-directory: src
        run: flutter build ios --release --no-codesign --no-pub

      - name: Prune Xcode build logs before cache save
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/Logs ~/Library/Developer/Xcode/DerivedData/*/Index.noindex

      - name: Ad-hoc sign & package IPAs (Feather + SideStore)
        env:
          UPSTREAM_SHA: ${{ needs.check-upstream.outputs.sha }}
        run: |
          set -euo pipefail
          bash scripts/package_ipa.sh \
            "src/build/ios/iphoneos/Runner.app" \
            "$RUNNER_TEMP/ipa-out" \
            "$UPSTREAM_SHA"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.check-upstream.outputs.sha }}
          OUT_DIR: ${{ runner.temp }}/ipa-out
        run: |
          set -euo pipefail
          tag="fluxer-$UPSTREAM_SHA"
          short_sha="${UPSTREAM_SHA:0:12}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          Automatically built from [fluxerapp/flutter_client@$UPSTREAM_SHA](https://github.com/fluxerapp/flutter_client/commit/$UPSTREAM_SHA).

          - \`fluxer-sideload-no-plugins.ipa\` — Recommended for **SideStore** (avoids the 3-App-ID free Apple ID limit) and single-profile **Feather Sign**.
          - \`fluxer-unsigned.ipa\` — Full bundle including Broadcast, Notification Service, and Share extensions (for paid certs / multi-profile Feather Sign / TrollStore).

          Both IPAs are ad-hoc signed with normalized permissions and thinned to \`arm64\`; sign with your own certificate or sideloading tool before installing.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$OUT_DIR/fluxer-unsigned.ipa#fluxer-unsigned.ipa" \
              "$OUT_DIR/fluxer-sideload-no-plugins.ipa#fluxer-sideload-no-plugins.ipa" \
              "$OUT_DIR/upstream-commit.txt#upstream-commit.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
          else
            gh release create "$tag" \
              "$OUT_DIR/fluxer-unsigned.ipa#fluxer-unsigned.ipa" \
              "$OUT_DIR/fluxer-sideload-no-plugins.ipa#fluxer-sideload-no-plugins.ipa" \
              "$OUT_DIR/upstream-commit.txt#upstream-commit.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Fluxer iOS - $short_sha" \
              --notes-file "$notes_file"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-unsigned-ipas
          path: |
            ${{ runner.temp }}/ipa-out/fluxer-unsigned.ipa
            ${{ runner.temp }}/ipa-out/fluxer-sideload-no-plugins.ipa
          if-no-files-found: error
          retention-days: 14
